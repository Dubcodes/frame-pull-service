[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-pull-service"
version = "0.1.0"
description = "Review-first Trackside interview evidence service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
