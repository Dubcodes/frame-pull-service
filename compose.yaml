x-frame-pull-common: &frame-pull-common
  image: frame-pull-service:${FRAME_PULL_IMAGE_TAG:-local}
  build:
    context: .
  env_file:
    - ${FRAME_PULL_ENV_FILE:-.env}
  environment: &container-environment
    FRAME_PULL_SOURCE_DIR: /recordings
    FRAME_PULL_DATA_DIR: /data
    FRAME_PULL_DATABASE_URL: sqlite:////data/frame_pull.db
    FRAME_PULL_LEGACY_ENGINE_ROOT: /legacy
    FRAME_PULL_LEGACY_PYTHON: /usr/local/bin/python
    FRAME_PULL_LEGACY_TESSERACT_CMD: /usr/bin/tesseract
    FRAME_PULL_LEGACY_FFMPEG_HWACCEL: ""
    FRAME_PULL_LEGACY_EXAMPLES_DIR: /legacy/examples/manual_profile_screenshots
    FRAME_PULL_HOST: 0.0.0.0
    FRAME_PULL_PORT: 8094
  init: true
  restart: unless-stopped
  stop_grace_period: 10m

services:
  frame-pull-web:
    <<: *frame-pull-common
    command: ["python", "-m", "uvicorn", "frame_pull_service.main:app", "--host", "0.0.0.0", "--port", "8094"]
    ports:
      - "${FRAME_PULL_PUBLISHED_PORT:-8094}:8094"
    volumes:
      - "${FRAME_PULL_HOST_DATA_DIR:-/srv/frame-pull/data}:/data"
      - "${FRAME_PULL_HOST_RECORDINGS_DIR:-/srv/frame-pull/recordings}:/recordings"
      - "${FRAME_PULL_HOST_LEGACY_DIR:-/srv/frame-pull/legacy}:/legacy:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frame-pull-worker:
    <<: *frame-pull-common
    command: ["python", "-m", "frame_pull_service.worker_entry"]
    depends_on:
      frame-pull-web:
        condition: service_healthy
    volumes:
      - "${FRAME_PULL_HOST_DATA_DIR:-/srv/frame-pull/data}:/data"
      - "${FRAME_PULL_HOST_RECORDINGS_DIR:-/srv/frame-pull/recordings}:/recordings:ro"
      - "${FRAME_PULL_HOST_LEGACY_DIR:-/srv/frame-pull/legacy}:/legacy:ro"
