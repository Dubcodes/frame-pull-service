<!doctype html><html><head><meta charset="utf-8"><title>Frame Pull Service</title><link rel="stylesheet" href="/static/app.css"></head><body>
<header><h1>Frame Pull Service</h1><nav><a href="/review">Review queue</a><a href="/settings">Settings</a><button title="Check source folders for closed, stable recordings" id="discover">Discover now</button></nav></header>
<main class="dashboard"><section class="statusbar"><strong id="health">Loading service status...</strong><button title="Allow active jobs to finish, then stop claiming new jobs" id="pause">Pause after current</button><button title="Allow workers to claim queued recordings" id="resume">Resume processing</button></section><section class="recorder-status"><strong id="recorder">Recorder status loading...</strong><div class="bulk"><button title="Start a manual recorder session only when a configured input is available" id="start-recorder">Start recording</button><button title="Finish the current segment before stopping the recorder" id="stop-after-chunk">Stop after current chunk</button><button title="Stop the configured recorder now; the final chunk still passes stability checks" id="stop-recorder">Stop recording</button></div></section><section class="stats"><div><b>{{ recordings }}</b><span>recordings</span></div><div><b>{{ pending }}</b><span>pending interviews</span></div><div><b>{{ approved }}</b><span>approved</span></div></section><section><h2>Race Days</h2><p class="muted">Recordings are grouped by their broadcast date. Expand a day for file-level queue control.</p><div id="race-days" class="race-days"></div></section></main>
<script src="/static/dashboard.js"></script></body></html>
