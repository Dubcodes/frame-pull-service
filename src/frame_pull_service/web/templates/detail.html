<!doctype html><html><head><meta charset="utf-8"><title>Interview Review</title><link rel="stylesheet" href="/static/app.css"></head><body><header><h1>Interview Review</h1><nav><a href="/review">Queue</a><a href="/">Race Days</a></nav></header><main class="detail" data-interview-id="{{ interview_id }}"><section class="player"><video id="clip" controls preload="metadata"></video><div><button title="Capture an exact native-source frame at this clip position" id="capture">Use this frame</button><span id="timing"></span></div></section><section class="context-panel"><h2>Interview context</h2><div id="context"></div></section><section><h2>Portrait candidates</h2><div id="candidates" class="candidate-strip"></div></section><section class="form"><label>Final name<input id="final-name"></label><label>Final role<input id="final-role"></label><label>Final track<input id="final-track"></label><p id="ocr"></p><button title="Save name, role and track evidence" id="save">Save review</button><button title="Approve the selected portrait and preserve it for export" id="approve">Approve</button><button title="Keep evidence but exclude this item from portrait export" class="danger" id="reject">Reject false positive</button></section><details><summary>Show technical evidence</summary><pre id="evidence"></pre></details></main><dialog id="lightbox"><button title="Close enlarged image" id="close-lightbox">Close</button><button title="Previous candidate" id="previous">Previous</button><button title="Next candidate" id="next">Next</button><button title="Select this image as the portrait" id="select-lightbox">Select this image</button><img id="lightbox-image" alt="Portrait candidate"></dialog><script src="/static/detail.js"></script></body></html>
