<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Interview Review · Frame Pull</title><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/app.css"></head><body><header><h1>Interview Review</h1><nav><a href="/review">Review queue</a><a href="/">Race days</a><a href="/settings">Settings</a></nav></header><main class="detail" data-interview-id="{{ interview_id }}"><section class="player"><video id="clip" controls preload="metadata"></video><div class="toolbar"><button title="Capture exact native-source frame (C)" id="capture">Use this frame</button><span id="timing"></span></div><p class="muted">Shortcuts: Space play/pause · ←/→ one second · C capture · A approve</p></section><section class="context-panel"><h2>Interview context</h2><div id="context"></div></section><section><h2>Portrait candidates</h2><div id="candidates" class="candidate-strip"></div></section><section class="form"><label>Final name<input id="final-name"></label><label>Final role<input id="final-role"></label><label>Final track<input id="final-track"></label><p id="ocr"></p><div><button id="save">Save review</button> <button id="approve">Approve</button> <button class="danger" id="reject">Reject</button></div><span id="save-state" class="muted"></span></section><details><summary>Show technical evidence</summary><pre id="evidence"></pre></details></main><dialog id="lightbox"><button id="close-lightbox">Close</button><button id="previous">Previous</button><button id="next">Next</button><button id="select-lightbox">Select this image</button><img id="lightbox-image" alt="Portrait candidate"></dialog><script src="/static/detail.js"></script></body></html>
