<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Frame Pull — Settings</title><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/app.css"><style>.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.settings-card{background:#202832;border:1px solid #343e4a;border-radius:5px;padding:14px}.settings-card h2{margin-top:0}.settings-card label{margin-bottom:10px}.settings-actions{position:sticky;bottom:0;background:#15191fee;padding:12px 0}</style></head><body><header><h1>Operational Settings</h1><nav><a href="/">Race days</a><a href="/review">Review queue</a></nav></header><main class="settings"><form class="settings-grid"><section class="settings-card"><h2>Processing</h2><div id="processing-fields"></div></section><section class="settings-card"><h2>Race day / Calendar</h2><div id="calendar-fields"></div></section><section class="settings-card"><h2>Recorder</h2><div id="recorder-fields"></div></section><section class="settings-card"><h2>Source lifecycle</h2><div id="lifecycle-fields"></div><p id="lifecycle-status" class="muted">Loading…</p></section><section class="settings-card"><h2>Review</h2><div id="review-fields"></div></section></form><div class="settings-actions"><button id="save">Save settings</button><span id="saved" class="muted"></span></div></main><script src="/static/settings.js"></script></body></html>
